[build]
  functions = "netlify/functions"
  command = "npm run build"

[dev]
  command = "npm run dev"

[functions]
  node_bundler = "esbuild"

[redirects]
# Route all /api/* requests to the Netlify function
  [[redirects]]
    from = "/api/*"
    to = "/.netlify/functions/server/:splat"
    status = 200
